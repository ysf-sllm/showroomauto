<header class="hero">
  <p class="eyebrow">Curated showroom</p>
  <h1>Welcome to my showroom!</h1>
  <p class="lede">Explore the range, find the right fit, and take a closer look at the details that matter.</p>

  <dl class="stats">
    <div>
      <dt>Cars</dt>
      <dd>{{ stats().cars }}</dd>
    </div>
    <div>
      <dt>Brands</dt>
      <dd>{{ stats().brands }}</dd>
    </div>
    <div>
      <dt>Starting price</dt>
      <dd>{{ stats().from }} <small>DNT</small></dd>
    </div>
  </dl>
</header>
